# r1wb_task_ppo_mlp.yaml with the learner spread over two GPUs (two learner workers, FSDP over NCCL), simulator and
# policy inference on the first: the placement a model too large for one GPU needs.
# RLinf embodied PPO with its MLP policy on the whole-body teacher task (trial; layout of RLinf's
# genesis_cubepick_ppo_mlp.yaml). Rollout: total_num_envs x 24 steps per epoch, as the rsl_rl runs use.
defaults:
  - env/r1wb_task@env.train
  - env/r1wb_task@env.eval
  - model/mlp_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1
    env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "r1wb_task_ppo_mlp"
    logger_backends: ["tensorboard"]
  max_epochs: 200
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: -1
  seq_length: 1
  max_prompt_length: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 5
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  bootstrap_type: standard
  kl_beta: 0.0
  entropy_bonus: 0.003
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 1.0

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 4096
    group_size: ${algorithm.group_size}
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 24
    use_rel_reward: False
    reward_coef: ${algorithm.reward_coef}
    is_eval: False
  eval:
    rollout_epoch: 1
    total_num_envs: 64
    group_size: ${algorithm.group_size}
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 24
    use_rel_reward: False
    reward_coef: ${algorithm.reward_coef}
    is_eval: True

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: ""
    precision: ${actor.model.precision}
  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 24576
  global_batch_size: 24576
  seed: 1234
  enable_offload: False
  model:
    model_type: mlp_policy
    model_path: ""
    policy_setup: panda-qpos
    obs_dim: 294
    action_dim: 24
    num_action_chunks: 1
    hidden_dim: 256
    precision: "32"
    add_value_head: True
    is_lora: False
    lora_rank: 32
  optim:
    lr: 3.0e-4
    value_lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0
    clip_grad: 1.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: False
    cpu_offload: False
    offload_pin_memory: False
    reshard_after_forward: True
    enable_gradient_accumulation: True
    forward_prefetch: False
    limit_all_gathers: False
    backward_prefetch: null
    use_orig_params: False
    use_liger_kernel: False
    fsdp_size: -1
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    amp:
      enabled: False
      precision: bf16
      use_grad_scaler: False

reward:
  use_reward_model: False

critic:
  use_critic_model: False

# The learner's weights reach the policy-inference worker as CPU tensors (see r1wb_task_ppo_mlp.yaml): no CUDA IPC
# and no NCCL between the workers.
weight_syncer:
  patch:
    transport_device: cpu
