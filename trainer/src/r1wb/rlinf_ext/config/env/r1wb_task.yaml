env_type: r1wb

seed: 0
total_num_envs: null
group_size: 1

auto_reset: True
ignore_terminations: False
use_fixed_reset_state_ids: False

max_steps_per_rollout_epoch: 24
max_episode_steps: 500

use_rel_reward: False
reward_coef: 1.0
is_eval: False

video_cfg:
  save_video: False
  info_on_video: False
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  task_name: wb_task_teacher_v2_anywhere
  obs_group: actor
  ret_device: cpu
