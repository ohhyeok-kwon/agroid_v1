[package]
name = "boot_manager"
version = "0.1.0"
edition = "2021"
description = "Boot entry point for the AGROID R1"
publish = false

[[bin]]
name = "boot_manager_node"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rclrs = "0.8"
ros-env = "0.3"
serde_json = "1"

# cargo-ament-build: installed to share/boot_manager/ next to package.xml.
[package.metadata.ros]
install_to_share = ["launch"]
