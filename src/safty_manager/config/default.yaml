# All safety layers are disabled for sequential verification. Restart after editing.
safty_manager:
  ros__parameters:
    recovery_hold_ms: 1000
    command_format: {enable: false}
    joint_range:
      enable: false
      warning: {enable: false, margin_rad: 0.10}
      fault: {enable: false, tolerance_rad: 0.00175}
    sudden_motion:
      enable: false
      warning: {enable: false, max_step_rad: 0.05, max_tracking_error_rad: 0.10}
      fault: {enable: false, max_step_rad: 0.10, max_tracking_error_rad: 0.25}
    speed:
      enable: false
      sample_period_ms: 20
      warning: {enable: false, max_rad_s: 0.2}
      fault: {enable: false, max_rad_s: 0.5}
    boot_status:
      enable: false
      startup_grace_ms: 10000
      warning: {enable: false, timeout_ms: 2000}
      fault: {enable: false, timeout_ms: 3000}
    feedback:
      enable: false
      startup_grace_ms: 10000
      warning: {enable: false, timeout_ms: 250}
      fault: {enable: false, timeout_ms: 500}
