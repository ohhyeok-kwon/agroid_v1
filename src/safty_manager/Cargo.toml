[package]
name = "safty_manager"
version = "0.1.0"
edition = "2021"
description = "R1 motion command gateway before USB execution"
publish = false

[[bin]]
name = "safty_manager_node"
path = "src/main.rs"

[dependencies]
rclrs = "0.8"
ros-env = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[package.metadata.ros]
install_to_share = ["launch", "config"]
