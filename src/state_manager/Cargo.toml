[package]
name = "state_manager"
version = "0.1.0"
edition = "2021"
description = "R1 overall health and action state manager"
publish = false

[[bin]]
name = "state_manager_node"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rclrs = "0.8"
ros-env = "0.3"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The action node loop in motion/runtime.rs; only the action managers enable it.
ros = []

[package.metadata.ros]
install_to_share = ["launch", "config"]
